name: Build LUBESTATION site

# Type-checks and builds dst/lubestation-site/web on every push and pull request, and keeps the
# ready-to-upload public_html contents as a downloadable artifact. Deployment to the ParsPack host
# is manual (see dst/lubestation-site/web/README.md).

on:
  push:
    paths: ["dst/lubestation-site/web/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["dst/lubestation-site/web/**", ".github/workflows/build.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dst/lubestation-site/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dst/lubestation-site/web/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Upload public_html
        uses: actions/upload-artifact@v4
        with:
          name: lubestation-public_html
          path: dst/lubestation-site/web/dist
          include-hidden-files: true
