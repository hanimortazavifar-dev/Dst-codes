name: Build LUBESTATION site

# Type-checks and builds web/ on every push and pull request, and keeps the ready-to-upload
# public_html contents as a downloadable artifact. Deployment to the ParsPack host is manual
# (see web/README.md).

on:
  push:
    paths: ["web/**", ".github/workflows/build.yml"]
  pull_request:
    paths: ["web/**", ".github/workflows/build.yml"]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - run: npm run build

      - name: Upload public_html
        uses: actions/upload-artifact@v4
        with:
          name: lubestation-public_html
          path: web/dist
          include-hidden-files: true
